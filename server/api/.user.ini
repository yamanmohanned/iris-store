; حدود رفع الملفات لواجهة آيريس (تُقرأ تلقائياً على أغلب استضافات cPanel)
; الفيديو حتى 40MB، والاستيراد من إنستغرام ينزّل الوسائط من الخادم نفسه
upload_max_filesize = 42M
post_max_size = 48M
memory_limit = 128M
max_execution_time = 180
; المتجر لا يستخدم شريط تقدم الرفع؛ تعطيله يغلق أحد مسارَي PHP2Shell (CVE-2026-109619). هذا الملف يُقرأ على بعض
; أنواع PHP فقط، فالأثر المضمون هو ضبطه في php.ini أو إعدادات الخادم (يطلبه المالك من الاستضافة)
session.upload_progress.enabled = 0
