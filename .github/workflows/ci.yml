name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris_ci_password
          POSTGRES_DB: iris
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iris" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://iris:iris_ci_password@localhost:5432/iris
      DATABASE_URL_TEST: postgres://iris:iris_ci_password@localhost:5432/iris_test
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-48
      APP_URL: http://localhost:3200
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=iris_ci_password psql -h localhost -U iris -d iris -c "CREATE DATABASE iris_test"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Dependency audit (production deps, high+)
        run: pnpm audit --prod --audit-level high
      - run: pnpm build
      - name: Prepare database for E2E
        run: |
          if [ -d drizzle ]; then pnpm db:migrate && pnpm db:seed; fi
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
