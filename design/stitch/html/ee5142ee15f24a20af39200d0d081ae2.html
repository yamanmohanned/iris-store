<script>
  let currentQty = 1;

  function adjustQty(delta) {
    currentQty = Math.max(1, Math.min(maxQty, currentQty + delta));
    const counterEl = document.getElementById('qty-counter');
    if (counterEl) {
      counterEl.textContent = currentQty;
    }

  function selectColor(type, label) {
    const goldBtn = document.getElementById('color-gold');
    const silverBtn = document.getElementById('color-silver');
    const labelEl = document.getElementById('selected-color-label');

    if (labelEl) labelEl.textContent = label;

    if (type === 'gold') {

      goldBtn.querySelector('span > span').className = "w-5 h-5 rounded-full flex items-center justify-center";

  function selectLength(selectedBtn) {

  }
