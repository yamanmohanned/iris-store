<script>
  (function initSplashScreen() {
    const progressBar = document.getElementById('vault-progress');
    const glimmer = document.getElementById('vault-glimmer');
    const statusText = document.getElementById('vault-status');
    
    if (!progressBar || !glimmer) return;

    let progress = 0;
    const stages = [
      { at: 25, label: "فحص أقفال الخزينة..." },
      { at: 65, label: "استحضار القطع النادرة..." },
      { at: 90, label: "الترحيب بكم في آيريس..." },
      { at: 100, label: "أهلاً بكم" }
    ];

    const interval = setInterval(() => {
      progress += Math.floor(Math.random() * 8) + 3;
      if (progress >= 100) {
        progress = 100;
        clearInterval(interval);
      }

      progressBar.style.width = progress + '%';
      glimmer.style.right = 'calc(' + progress + '% - 16px)';

      const currentStage = stages.find(s => progress <= s.at);
      if (currentStage && statusText && statusText.textContent !== currentStage.label) {
        statusText.style.opacity = '0';
        setTimeout(() => {
          statusText.textContent = currentStage.label;
          statusText.style.opacity = '1';
        }, 150);
      }
    }, 120);
  })();
