<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2A030D" />
    <meta name="description" content="آيريس — دار المجوهرات الراقية. قلائد وخواتم وأساور وأقراط منتقاة بعناية، مغلّفة بأناقة وتصل إلى باب بيتك." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>آيريس | دار المجوهرات الراقية</title>

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_IQ" />
    <meta property="og:site_name" content="آيريس للمجوهرات" />
    <meta property="og:title" content="آيريس | دار المجوهرات الراقية" />
    <meta property="og:description" content="قلائد وخواتم وأساور وأقراط منتقاة بعناية، مغلّفة بأناقة وتصل إلى باب بيتك." />
    <meta property="og:image" content="/brand/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- الخطوط مستضافة محلياً (src/styles/fonts.css): نحمّل الأهم مبكراً قبل تشغيل الواجهة -->
    <link rel="preload" href="/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-arabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/el-messiri-arabic.woff2" as="font" type="font/woff2" crossorigin />

    <!-- أول رسم للصفحة: خلفية الدار وشعارها بدل صفحة بيضاء حتى تجهز الواجهة -->
    <style>
      html,
      body {
        margin: 0;
        background: #fbf6ef;
      }
      .boot {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-mark {
        height: 56px;
        aspect-ratio: 430 / 706;
        background: #4e1825;
        -webkit-mask: url('/brand/iris-mark.png') center / contain no-repeat;
        mask: url('/brand/iris-mark.png') center / contain no-repeat;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="bg-ivory-canvas font-body-md text-on-surface antialiased">
    <div id="root">
      <div class="boot" role="status" aria-label="جارٍ التحميل"><span class="boot-mark"></span></div>
    </div>
    <noscript>يرجى تفعيل JavaScript لعرض متجر آيريس.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
